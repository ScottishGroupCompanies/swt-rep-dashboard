<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Rep Dashboard — Scottish Group Companies</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --navy: #1B2A4A;
      --ink: #1B2A4A;
      --muted: #5c6b82;
      --line: #d5dbe6;
      --bg: #f5f6f8;
      --card: #ffffff;
      --chart-2: #4E628A;
      --ok: #15803d;
      --warn: #b45309;
      --danger: #b91c1c;
      --shadow: 0 10px 30px rgba(27, 42, 74, 0.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
    body.locked { overflow: hidden; }
    .gate {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
      background:
        radial-gradient(900px 480px at 12% 0%, rgba(255,255,255,.08), transparent 55%),
        linear-gradient(165deg, #121c33, #1B2A4A 58%, #243656);
      color: #fff;
    }
    .gate.hidden { display: none; }
    .gate-card {
      width: min(420px, 92vw); padding: 36px 32px 28px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center;
    }
    .brand-logo { height: 52px; width: auto; max-width: 100%; color: var(--navy); display: block; }
    .gate .brand-logo { height: 64px; margin: 0 auto 18px; color: #fff; }
    .brand-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; min-width: 0; }
    .gate h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 2rem; margin: 0 0 6px; }
    .gate p { color: rgba(255,255,255,.72); margin: 0 0 18px; font-size: .95rem; }
    .field { text-align: left; margin-bottom: 12px; }
    .field span { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 6px; color: rgba(255,255,255,.8); }
    .field select, .field input {
      width: 100%; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2);
      background: rgba(0,0,0,.25); color: #fff; font: inherit;
    }
    .field select option { color: #1B2A4A; }
    .gate button {
      width: 100%; margin-top: 8px; padding: 14px 16px; border: 0; border-radius: 12px;
      background: #fff; color: var(--navy); font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .gate-error { color: #fecaca; min-height: 1.2em; font-size: .85rem; margin-top: 10px; }
    .app { display: none; max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
    .app.visible { display: block; }
    header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
    h1.page-title { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.4rem); margin: 0; color: var(--navy); }
    .sub { color: var(--muted); margin: 6px 0 0; font-size: .95rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .switch { display: flex; flex-wrap: wrap; gap: 8px; }
    .switch button, .filters button, .back-link {
      border: 1px solid var(--line); background: #fff; color: var(--navy); border-radius: 999px;
      padding: 8px 12px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
    }
    .switch button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .filters select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; background: #fff; }
    .filters label { font-size: .78rem; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
    .back-link { margin: 0 0 12px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 14px; }
    @media (max-width: 800px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { .kpi-grid { grid-template-columns: 1fr; } }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
    .kpi .label { font-size: .75rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .kpi .value { font-size: 1.35rem; font-weight: 700; color: var(--navy); letter-spacing: -.02em; overflow-wrap: anywhere; }
    .kpi .hint { font-size: .72rem; color: var(--muted); margin-top: 6px; }
    .kpi.accent { background: var(--navy); border: 0; }
    .kpi.accent .label, .kpi.accent .hint { color: rgba(255,255,255,.72); }
    .kpi.accent .value { color: #fff; }
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
    @media (max-width: 960px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; min-width: 0; }
    .card h2 { margin: 0 0 4px; font-size: 1.05rem; color: var(--navy); }
    .card .caption { color: var(--muted); font-size: .82rem; margin: 0 0 14px; }
    .chart-wrap { position: relative; height: 280px; min-width: 0; }
    .chart-wrap canvas { max-width: 100%; }
    table.jobs, table.compare-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    table.jobs th, table.jobs td, table.compare-table th, table.compare-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.compare-table th, table.compare-table td { text-align: right; }
    table.compare-table th:first-child, table.compare-table td:first-child { text-align: left; }
    table.jobs th, table.compare-table th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
    .scroll { overflow-x: auto; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600; background: #eef2f7; color: var(--navy); }
    .pill.warn { background: #fff7ed; color: var(--warn); }
    .pill.muted { background: #f1f5f9; color: var(--muted); }
    .pill.danger { background: #fef2f2; color: var(--danger); }
    .name-button { border: 0; background: transparent; color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-align: left; }
    .state-bars { display: flex; flex-direction: column; gap: 8px; }
    .state-row { display: grid; grid-template-columns: minmax(0, 110px) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: .82rem; }
    .state-row .bar { height: 10px; background: #e8eef5; border-radius: 999px; overflow: hidden; }
    .state-row .fill { height: 100%; background: var(--navy); border-radius: 999px; }
    .money { font-variant-numeric: tabular-nums; }
    .delta.up { color: var(--ok); font-weight: 700; }
    .delta.down { color: var(--danger); font-weight: 700; }
    .rep-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .rep-picker label { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: .82rem; font-weight: 600; }
    .compare-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .compare-ranges { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    @media (max-width: 800px) { .compare-ranges { grid-template-columns: minmax(0, 1fr); } }
    .period { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
    .period.a { box-shadow: inset 3px 0 0 var(--navy); }
    .period.b { box-shadow: inset 3px 0 0 var(--chart-2); }
    .period strong { flex: 1 0 100%; color: var(--navy); }
    .period label { font-size: .75rem; color: var(--muted); font-weight: 600; }
    .period select { display: block; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; background: #fff; }
    footer.site { margin-top: 8px; color: var(--muted); font-size: .78rem; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 16px; }
    .notice { background: #f8fafc; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: .88rem; }
  </style>
</head>
<body class="locked">
  <div class="gate" id="gate">
    <form class="gate-card" id="signIn">
      <svg class="brand-logo" viewBox="0 0 268 56" role="img" aria-label="Scottish Group Companies">
        <rect width="56" height="56" rx="4" fill="#ffffff"/>
        <g fill="#1B2A4A">
          <rect x="4" y="4" width="22" height="22"/>
          <rect x="30" y="4" width="22" height="22"/>
          <rect x="4" y="30" width="22" height="22"/>
          <rect x="30" y="30" width="22" height="22"/>
        </g>
        <text x="72" y="28" fill="currentColor" font-family="Instrument Serif, Georgia, serif" font-size="26">SCOTTISH</text>
        <text x="72" y="46" fill="currentColor" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.6">GROUP COMPANIES</text>
      </svg>
      <h1>Rep Dashboard</h1>
      <p>Scottish Window Tinting and Scottish Stained Glass</p>
      <label class="field"><span>Name</span><select id="name" name="name" required><option value="">Loading names…</option></select></label>
      <label class="field"><span>Code</span><input id="code" name="code" type="password" autocomplete="current-password" required /></label>
      <button type="submit" id="signInBtn">Sign in</button>
      <div class="gate-error" id="gateError" role="alert"></div>
    </form>
  </div>

  <main class="app" id="app">
    <header class="top">
      <div class="brand-row">
        <svg class="brand-logo" viewBox="0 0 268 56" role="img" aria-label="Scottish Group Companies">
          <rect width="56" height="56" rx="4" fill="#ffffff"/>
          <g fill="#1B2A4A">
            <rect x="4" y="4" width="22" height="22"/>
            <rect x="30" y="4" width="22" height="22"/>
            <rect x="4" y="30" width="22" height="22"/>
            <rect x="30" y="30" width="22" height="22"/>
          </g>
          <text x="72" y="28" fill="currentColor" font-family="Instrument Serif, Georgia, serif" font-size="26">SCOTTISH</text>
          <text x="72" y="46" fill="currentColor" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.6">GROUP COMPANIES</text>
        </svg>
        <div>
          <h1 class="page-title" id="pageTitle">Sales</h1>
          <p class="sub" id="pageSub"></p>
        </div>
      </div>
      <div class="filters">
        <div class="switch" id="companySwitch" role="group" aria-label="Company"></div>
        <label>Sheet year <select id="yearSelect"></select></label>
        <button type="button" id="signOut">Sign out</button>
      </div>
    </header>
    <button type="button" id="back" class="back-link" hidden>All reps</button>
    <div id="dash"></div>
    <footer class="site">Scottish Group Companies. Sales are pre-fee job totals. The year is the sheet tab. The month is Month Sold.</footer>
  </main>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
